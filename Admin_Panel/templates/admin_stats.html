<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .chart-container {
            width: 45%;
            display: inline-block;
            margin: 10px;
            vertical-align: top;
        }
        form {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h2>Grocery Dashboard</h2>
    <form method="GET">
        <label>Start Date:
            <input type="date" name="start_date" value="{{ request.args.get('start_date', '') }}">
        </label>
        <label>End Date:
            <input type="date" name="end_date" value="{{ request.args.get('end_date', '') }}">
        </label>
        <button type="submit">Filter</button>
    </form>
    <div class="chart-container">{{ revenue_chart | safe }}</div>
    <div class="chart-container">{{ category_chart | safe }}</div>
    <div class="chart-container">{{ top_product_chart | safe }}</div>
    <div class="chart-container">{{ daily_chart | safe }}</div>
</body>
</html>
